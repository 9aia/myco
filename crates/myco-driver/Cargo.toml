[package]
name = "myco-driver"
description = "tamias-driver-myco — pavo view driver over a repo's project/ ledger (reads via myco-ops)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tamias-driver-myco"
path = "src/main.rs"

[features]
# Embedded surface (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains an `mcp` argv verb that serves its own
# ops manifest; the standalone tamias-driver-mcp binary fronts the
# same ops without any feature. There is no `cli` feature: `cli` is
# the tamias `bins[]` shim passthrough verb (always on — it strips
# `--dir`/`--name` and runs the engine's own argv grammar, which a
# generated surface can't express). default = view driver + `run`/
# `cli` passthroughs.
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
myco.workspace = true
myco-core.workspace = true
myco-config.workspace = true
myco-config-toml.workspace = true
myco-ops.workspace = true
myco-store.workspace = true
myco-store-md.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
# The public wire contract — git dep so `cargo install --git` and
# `cargo xtask install` work without a sibling ../pavo checkout
# (path deps break workspace resolution on a fresh clone).
# `version` is the crates.io fallback once pavo-protocol publishes.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# Driver-authoring kit — the ndjson `serve` loop plus the
# manifest/ViewSpec/QueryBinding/ViewNode builders this crate used to
# hand-roll. Same git source as pavo-protocol (they resolve to one
# rev); `version` is the crates.io fallback once it publishes.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-myco serve` binary.
# Git dep to match pavo-protocol above (path deps break
# `cargo install --git` / fresh-clone resolution).
pavo-testkit = { git = "https://github.com/9aia/pavo" }
# Engine e2e suite — the retired `myco` bin's integration tests
# moved here and spawn `tamias-driver-myco run <argv>` (the same
# passthrough `cli.*` wire queries and the bins[] shim use).
tempfile.workspace = true
temp-env.workspace = true
insta.workspace = true

[lints]
workspace = true
