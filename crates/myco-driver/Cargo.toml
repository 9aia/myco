[package]
name = "myco-driver"
description = "tamias-driver-myco — pavo view driver over a repo's project/ ledger (reads via myco-ops)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tamias-driver-myco"
path = "src/main.rs"

[dependencies]
myco-core.workspace = true
myco-config.workspace = true
myco-config-toml.workspace = true
myco-ops.workspace = true
myco-store.workspace = true
myco-store-md.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
# The public wire contract — sibling-checkout path dep until
# pavo-protocol is published (the whole 9aia org lives side-by-side
# under one parent dir; `version` is the crates.io fallback).
pavo-protocol = { path = "../../../pavo/crates/pavo-protocol", version = "0.1.0" }

[lints]
workspace = true
