name: Docs

on:
  push:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Mirror the local worktree layout: main at the root, this
      # branch at docs/ — the gen scripts resolve `..` to find
      # crates/, Cargo.tomls, and the CLI.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: docs
          path: docs
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install
        working-directory: docs
      # rustdoc API → docs/public/api (must precede the vitepress
      # build so public/ picks it up)
      - run: bun run docs:api
        working-directory: docs
      # reference/cli.md, config.md, crate-api.md + crate map are
      # regenerated from the main checkout every deploy
      - run: bun run docs:build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
