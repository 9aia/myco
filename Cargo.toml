[workspace]
resolver = "2"
members = [
    "crates/myco-cli",
    "crates/myco-config",
    "crates/myco-config-toml",
    "crates/myco-core",
    "crates/myco-git",
    "crates/myco-index",
    "crates/myco-index-redb",
    "crates/myco-shell",
    "crates/myco-store",
    "crates/myco-store-md",
    "crates/myco-testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/myco"
description = "Project management, grown not built — a mycorrhizal network for your agents: tasks, signals, handoffs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
myco = { path = "crates/myco-cli", version = "0.1.0" }
myco-config = { path = "crates/myco-config", version = "0.1.0" }
myco-config-toml = { path = "crates/myco-config-toml", version = "0.1.0" }
myco-core = { path = "crates/myco-core", version = "0.1.0" }
myco-git = { path = "crates/myco-git", version = "0.1.0" }
myco-index = { path = "crates/myco-index", version = "0.1.0" }
myco-index-redb = { path = "crates/myco-index-redb", version = "0.1.0" }
myco-shell = { path = "crates/myco-shell", version = "0.1.0" }
myco-store = { path = "crates/myco-store", version = "0.1.0" }
myco-store-md = { path = "crates/myco-store-md", version = "0.1.0" }
myco-testkit = { path = "crates/myco-testkit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1.5"
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
camino = { version = "1", features = ["serde1"] }
slug = "0.1"
markdown = "1"
mdast_util_to_markdown = "0.0.2"
schemars = "1"
miette = "7"
insta = "1"
proptest = "1"
tempfile = "3"
temp-env = "0.3"
redb = "3"
tabled = "0.20"
terminal_size = "0.4"
unicode-width = "0.2"
csv = "1"
sigpipe = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
